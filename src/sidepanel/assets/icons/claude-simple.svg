<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle with Gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#claudeGrad)" filter="url(#shadow)" />
  
  <!-- Claude Logo - Simple Abstract Design -->
  <g transform="translate(64, 64)">
    <!-- Central abstract shape representing Claude -->
    <path d="M -20,-15 Q -10,-25 0,-20 Q 10,-25 20,-15 Q 25,-5 20,5 Q 10,15 0,10 Q -10,15 -20,5 Q -25,-5 -20,-15 Z" 
          fill="white" opacity="0.9"/>
    
    <!-- Inner detail -->
    <circle cx="0" cy="-5" r="8" fill="url(#claudeGrad)" opacity="0.8"/>
    <circle cx="-8" cy="5" r="5" fill="white" opacity="0.7"/>
    <circle cx="8" cy="5" r="5" fill="white" opacity="0.7"/>
    
    <!-- Connecting lines -->
    <line x1="0" y1="-5" x2="-8" y2="5" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-5" x2="8" y2="5" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
