<!doctype html>
<html lang="zh-CN" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AI Multiverse</title>
        <link rel="stylesheet" href="sidepanel.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../lib/github.min.css" />
    </head>

    <body>
        <div class="sidebar-container">
            <!-- Header -->
            <header class="sidebar-header">
                <div class="logo-area">
                    <img
                        src="assets/icons/icon.svg"
                        class="main-logo-img"
                        alt="Logo"
                    />
                    <h2 data-i18n="logo">AI 多重宇宙</h2>
                </div>
                <div class="header-actions">
                    <button
                        class="icon-btn"
                        id="langToggleBtn"
                        data-i18n-title="switch_language"
                        title="Switch Language"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path
                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
                            ></path>
                        </svg>
                        <span class="lang-badge">中文</span>
                    </button>
                    <button
                        class="icon-btn"
                        id="openModelsBtn"
                        data-i18n-title="choose_models"
                        title="Choose AI Models"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                            ></path>
                        </svg>
                        <span class="btn-badge" id="selectionBadge">0</span>
                    </button>
                    <div class="header-divider"></div>
                    <button
                        class="icon-btn highlight-btn"
                        id="launchOnlyBtn"
                        data-i18n-title="open_selected"
                        title="Open Selected Only"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                            ></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </button>
                    <button
                        class="icon-btn"
                        id="tileBtn"
                        data-i18n-title="arrange_selected"
                        title="Tile Windows"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </button>
                    <button
                        class="icon-btn danger-btn"
                        id="closeBtn"
                        data-i18n-title="close_all"
                        title="Close All"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <rect
                                x="3"
                                y="3"
                                width="18"
                                height="18"
                                rx="2"
                                ry="2"
                            ></rect>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                        </svg>
                    </button>
                    <div class="header-divider"></div>
                    <button
                        class="icon-btn"
                        id="clearHistoryBtn"
                        data-i18n-title="clear_history"
                        title="Clear History"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                            ></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Main Chat Interface -->
            <div class="chat-interface">
                <div class="conversation-stream" id="conversationStream">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon">💬</div>
                        <p data-i18n="no_conversations">开始你的第一次对话</p>
                    </div>
                </div>
                <!-- 悬浮直达总结按钮 -->
                <button
                    id="floatJumpSummary"
                    class="float-jump-btn"
                    data-i18n-title="jump_to_summary"
                    title="Jump to Summary"
                >
                    ✨
                </button>
            </div>

            <!-- Input Section (Fixed at bottom) -->
            <div class="input-section" id="inputSection">
                <!-- File Preview -->
                <div
                    class="file-preview-container"
                    id="filePreview"
                    style="display: none"
                >
                    <div class="file-preview-header">
                        <span data-i18n="file_preview">已附加文件</span>
                        <button
                            class="clear-files-btn"
                            id="clearFilesBtn"
                            data-i18n="file_clear_all"
                        >
                            清空
                        </button>
                    </div>
                    <div class="file-preview-list" id="filePreviewList"></div>
                </div>

                <!-- Drag Overlay -->
                <div class="drag-overlay" id="dragOverlay">
                    <div class="drag-overlay-content">
                        <svg
                            width="48"
                            height="48"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                            ></path>
                        </svg>
                        <p data-i18n="drag_files_here">拖放文件到此处上传</p>
                    </div>
                </div>

                <!-- Input Box -->
                <div class="input-box">
                    <input
                        type="file"
                        id="fileInput"
                        multiple
                        accept="image/*,.pdf,.txt,.doc,.docx,.md,.json,.csv"
                        style="display: none"
                    />

                    <div class="input-wrapper">
                        <textarea
                            id="prompt"
                            data-i18n-placeholder="ask_anything"
                            placeholder="输入任何问题... (Enter 发送)"
                            rows="1"
                        ></textarea>

                        <div class="input-actions">
                            <button
                                class="action-btn"
                                id="attachFileBtn"
                                data-i18n-title="attach_files"
                                title="Attach Files"
                            >
                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                                    ></path>
                                </svg>
                            </button>
                            <button class="action-btn primary" id="sendBtn">
                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon
                                        points="22 2 15 22 11 13 2 9 22 2"
                                    ></polygon>
                                </svg>
                            </button>
                            <button
                                class="action-btn"
                                id="summarizeBtn"
                                data-i18n-title="smart_summarize"
                                title="Smart Summarize"
                                style="font-size: 16px; line-height: 1"
                            >
                                ✨
                            </button>
                            <button
                                class="action-btn"
                                id="toggleAllBtn"
                                data-i18n-title="toggle_all"
                                title="Expand/Collapse All"
                            >
                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path d="M4 14h6v6"></path>
                                    <path d="M20 10h-6V4"></path>
                                    <path d="M14 10l7-7"></path>
                                    <path d="M3 21l7-7"></path>
                                </svg>
                            </button>
                            <button
                                class="action-btn"
                                id="copyAllBtn"
                                data-i18n-title="copy_all"
                                title="Copy All"
                            >
                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <rect
                                        x="9"
                                        y="9"
                                        width="13"
                                        height="13"
                                        rx="2"
                                        ry="2"
                                    ></rect>
                                    <path
                                        d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                                    ></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status Panel (hidden by default) -->
            <div class="status-panel" id="status"></div>

            <!-- Modals (keep all existing modals) -->
            <!-- Detail Modal -->
            <div class="modal-overlay" id="detailModal">
                <div class="modal-content detail-content">
                    <div
                        class="modal-resize-handle modal-resize-handle-left"
                    ></div>
                    <div
                        class="modal-resize-handle modal-resize-handle-right"
                    ></div>
                    <button
                        class="modal-nav-arrow modal-nav-left"
                        id="modalNavLeft"
                    >
                        <svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button
                        class="modal-nav-arrow modal-nav-right"
                        id="modalNavRight"
                    >
                        <svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                    <div class="modal-header">
                        <div class="modal-title detail-header-info">
                            <img
                                src=""
                                id="detailIcon"
                                class="provider-icon-img"
                                alt=""
                            />
                            <h3 id="detailName">AI Provider</h3>
                        </div>
                        <button class="close-modal-btn" id="closeDetailBtn">
                            &times;
                        </button>
                    </div>
                    <div class="detail-body" id="detailText"></div>
                    <div class="modal-footer detail-modal-footer">
                        <button class="primary-btn-send" id="copyDetailBtn">
                            复制此响应
                        </button>
                        <div
                            class="modal-position-indicator"
                            id="modalPositionIndicator"
                        >
                            <span class="position-text" id="positionText"
                                >1 of 1</span
                            >
                            <div class="position-dots" id="positionDots"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Models Modal -->
            <div class="modal-overlay" id="modelsModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="modal-title">
                            <h3 data-i18n="models_title">AI 模型</h3>
                            <p data-i18n="select_recipients">选择接收方</p>
                        </div>
                        <button class="close-modal-btn" id="closeModelsBtn">
                            &times;
                        </button>
                    </div>
                    <div class="provider-controls">
                        <button
                            class="toggle-all-btn"
                            id="modelToggleAllBtn"
                            title="切换全选/全不选"
                        >
                            <svg
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <rect
                                    x="3"
                                    y="3"
                                    width="18"
                                    height="18"
                                    rx="2"
                                    ry="2"
                                ></rect>
                                <polyline points="9,11 12,14 20,6"></polyline>
                            </svg>
                            <span class="toggle-text">全选</span>
                        </button>
                    </div>
                    <div class="provider-grid">
                        <label class="provider-card" for="gemini">
                            <input
                                type="checkbox"
                                id="gemini"
                                value="gemini"
                                checked
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/gemini.svg"
                                    class="provider-icon-img"
                                    alt="Gemini"
                                />
                                <span class="provider-name">Gemini</span>
                            </div>
                        </label>
                        <label class="provider-card" for="grok">
                            <input
                                type="checkbox"
                                id="grok"
                                value="grok"
                                checked
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/grok.svg"
                                    class="provider-icon-img"
                                    alt="Grok"
                                />
                                <span class="provider-name">Grok</span>
                            </div>
                        </label>
                        <label class="provider-card" for="kimi">
                            <input
                                type="checkbox"
                                id="kimi"
                                value="kimi"
                                checked
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/kimi.png"
                                    class="provider-icon-img"
                                    alt="Kimi"
                                />
                                <span class="provider-name">Kimi</span>
                            </div>
                        </label>
                        <label class="provider-card" for="deepseek">
                            <input
                                type="checkbox"
                                id="deepseek"
                                value="deepseek"
                                checked
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/deepseek.svg"
                                    class="provider-icon-img"
                                    alt="DeepSeek"
                                />
                                <span class="provider-name">DeepSeek</span>
                            </div>
                        </label>
                        <label class="provider-card" for="chatgpt">
                            <input
                                type="checkbox"
                                id="chatgpt"
                                value="chatgpt"
                                checked
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/chatgpt.svg"
                                    class="provider-icon-img"
                                    alt="ChatGPT"
                                />
                                <span class="provider-name">ChatGPT</span>
                            </div>
                        </label>
                        <label class="provider-card" for="qwen">
                            <input
                                type="checkbox"
                                id="qwen"
                                value="qwen"
                                checked
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/qwen.svg"
                                    class="provider-icon-img"
                                    alt="Qwen"
                                />
                                <span class="provider-name">通义千问</span>
                            </div>
                        </label>
                        <label class="provider-card" for="yuanbao">
                            <input
                                type="checkbox"
                                id="yuanbao"
                                value="yuanbao"
                                checked
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/yuanbao.svg"
                                    class="provider-icon-img"
                                    alt="Yuanbao"
                                />
                                <span class="provider-name">腾讯元宝</span>
                            </div>
                        </label>

                        <label class="provider-card" for="claude">
                            <input type="checkbox" id="claude" value="claude" />
                            <div class="card-content">
                                <img
                                    src="assets/icons/claude-logo.svg"
                                    class="provider-icon-img"
                                    alt="Claude"
                                />
                                <span class="provider-name">Claude</span>
                            </div>
                        </label>

                        <label class="provider-card" for="yiyan">
                            <input type="checkbox" id="yiyan" value="yiyan" />
                            <div class="card-content">
                                <img
                                    src="assets/icons/qwen.svg"
                                    class="provider-icon-img"
                                    alt="Yiyan"
                                />
                                <span class="provider-name">文心一言</span>
                            </div>
                        </label>

                        <label class="provider-card" for="doubao">
                            <input type="checkbox" id="doubao" value="doubao" />
                            <div class="card-content">
                                <img
                                    src="assets/icons/doubao.svg"
                                    class="provider-icon-img"
                                    alt="Doubao"
                                />
                                <span class="provider-name">豆包</span>
                            </div>
                        </label>

                        <label class="provider-card" for="mistral">
                            <input
                                type="checkbox"
                                id="mistral"
                                value="mistral"
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/mistral.svg"
                                    class="provider-icon-img"
                                    alt="Mistral"
                                />
                                <span class="provider-name">Mistral</span>
                            </div>
                        </label>

                        <label class="provider-card" for="metaso">
                            <input type="checkbox" id="metaso" value="metaso" />
                            <div class="card-content">
                                <img
                                    src="assets/icons/deepseek.svg"
                                    class="provider-icon-img"
                                    alt="MetaSo"
                                />
                                <span class="provider-name">MetaSo</span>
                            </div>
                        </label>

                        <label class="provider-card" for="chatglm">
                            <input
                                type="checkbox"
                                id="chatglm"
                                value="chatglm"
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/chatglm.svg"
                                    class="provider-icon-img"
                                    alt="ChatGLM"
                                />
                                <span class="provider-name">ChatGLM</span>
                            </div>
                        </label>

                        <label class="provider-card" for="stepfun">
                            <input
                                type="checkbox"
                                id="stepfun"
                                value="stepfun"
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/stepfun.svg"
                                    class="provider-icon-img"
                                    alt="StepFun"
                                />
                                <span class="provider-name">StepFun</span>
                            </div>
                        </label>

                        <label class="provider-card" for="copilot">
                            <input
                                type="checkbox"
                                id="copilot"
                                value="copilot"
                            />
                            <div class="card-content">
                                <img
                                    src="assets/icons/copilot.svg"
                                    class="provider-icon-img"
                                    alt="Copilot"
                                />
                                <span class="provider-name">Microsoft Copilot</span>
                            </div>
                        </label>
                    </div>
                    <div class="modal-footer">
                        <button
                            class="secondary-btn"
                            id="summarizeSettingsInModelsBtn"
                            data-i18n="summarize_settings"
                        >
                            智能总结设置
                        </button>
                        <button
                            class="primary-btn-blue"
                            id="confirmModelsBtn"
                            data-i18n="confirm"
                        >
                            确认
                        </button>
                    </div>
                </div>
            </div>

            <!-- Summarize Settings Modal -->
            <div class="modal-overlay" id="summarizeSettingsModal">
                <div class="modal-content summarize-modal">
                    <div class="modal-header">
                        <div class="modal-title">
                            <h3 data-i18n="summarize_settings_title">
                                总结设置
                            </h3>
                            <p data-i18n="summarize_settings_subtitle">
                                选择模型和提示词进行总结
                            </p>
                        </div>
                        <button
                            class="close-modal-btn"
                            id="closeSummarizeSettingsBtn"
                        >
                            &times;
                        </button>
                    </div>
                    <div class="summarize-body">
                        <div class="summarize-setting-group">
                            <label data-i18n="summarize_model_label"
                                >总结模型</label
                            >
                            <select
                                id="summarizeModelSelect"
                                class="summarize-select"
                                data-i18n-title="select_summary_model"
                                title="Select AI model for summarization"
                            >
                                <option value="gemini">Gemini</option>
                                <option value="grok">Grok</option>
                                <option value="kimi">Kimi</option>
                                <option value="deepseek">DeepSeek</option>
                                <option value="chatgpt">ChatGPT</option>
                                <option value="qwen">Qwen</option>
                                <option value="yuanbao">Yuanbao</option>
                            </select>
                        </div>
                        <div class="summarize-setting-group">
                            <label data-i18n="summarize_prompt_label"
                                >总结提示词</label
                            >
                            <div class="prompt-actions">
                                <button
                                    class="secondary-btn-small"
                                    id="useDefaultPromptBtn"
                                    data-i18n="use_defaultPrompt"
                                >
                                    使用默认
                                </button>
                                <button
                                    class="secondary-btn-small"
                                    id="resetPromptBtn"
                                    data-i18n="reset_prompt"
                                >
                                    重置
                                </button>
                            </div>
                            <textarea
                                id="summarizePromptInput"
                                class="summarize-textarea"
                                rows="8"
                                placeholder="输入自定义的总结提示词..."
                            ></textarea>

                    <div class="modal-footer">

                        <button

                            id="summarizeSettingsConfirmBtn"
                            data-i18n="confirm"
                        >

                    </div>
                </div>
            </div>
